<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO 分析 Agent</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { max-width: 560px; width: 90%; padding: 40px; }
.logo { text-align: center; margin-bottom: 32px; }
.logo h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
.card { background: #1e293b; border-radius: 16px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
.input-group { display: flex; gap: 8px; }
input { flex: 1; padding: 14px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #e2e8f0; font-size: 15px; outline: none; }
input:focus { border-color: #38bdf8; }
input::placeholder { color: #475569; }
button { padding: 14px 28px; background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.loading { display: none; text-align: center; margin-top: 24px; }
.loading.show { display: block; }
.spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #3b82f6; border-radius: 50%; margin: 0 auto 12px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading p { color: #94a3b8; font-size: 14px; }
.error { display: none; margin-top: 16px; padding: 12px 16px; background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.3); border-radius: 8px; color: #fca5a5; font-size: 14px; }
.error.show { display: block; }
.tips { margin-top: 20px; }
.tips h3 { font-size: 13px; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
.tips ul { list-style: none; }
.tips li { font-size: 13px; color: #94a3b8; padding: 4px 0; }
.tips li::before { content: "•"; color: #3b82f6; margin-right: 8px; }
.footer { text-align: center; margin-top: 24px; color: #475569; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
    <div class="logo"><h1>SEO 分析 Agent</h1><p>输入网站 URL，一键生成专业 SEO 诊断报告</p></div>
    <div class="card">
        <label>网站地址</label>
        <div class="input-group">
            <input type="text" id="url" placeholder="https://example.com">
            <button id="btn" onclick="analyze()">分析</button>
        </div>
        <div class="loading" id="loading"><div class="spinner"></div><p id="msg">正在分析...</p></div>
        <div class="error" id="error"></div>
        <div class="tips">
            <h3>检测维度</h3>
            <ul><li>TDK / robots / sitemap</li><li>页面 SEO / 技术问题</li><li>内容缺陷 / 整改建议</li></ul>
        </div>
    </div>
    <div class="footer">Powered by SEO Analysis Agent · Vercel</div>
</div>
<script>
function analyze(){
    var u=document.getElementById('url').value.trim();
    if(!u)return;
    if(!u.match(/^https?:\/\//))u='https://'+u;
    document.getElementById('btn').disabled=true;
    document.getElementById('loading').classList.add('show');
    document.getElementById('error').classList.remove('show');
    fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u}),signal:AbortSignal.timeout(30000)})
    .then(function(r){return r.ok?r.text():r.text().then(function(t){throw new Error(t)})})
    .then(function(h){document.open();document.write(h);document.close()})
    .catch(function(e){document.getElementById('error').textContent='分析超时或失败，请尝试其他网址';document.getElementById('error').classList.add('show');document.getElementById('btn').disabled=false;document.getElementById('loading').classList.remove('show')});
}
document.getElementById('url').addEventListener('keydown',function(e){if(e.key==='Enter')analyze()});
</script>
</body>
</html>
